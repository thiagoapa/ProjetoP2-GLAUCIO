<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADMIN</title>
    <link rel="shortcut icon" href="images/barco2.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/default.css" />
    <style>
.login-form {
  max-width: 400px;
  margin: 30px auto;
  padding: 20px;
  background: #f9f9f9;
  border-radius: 8px;
}

.login-form .entry {
  margin-bottom: 15px;
}

.login-form label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.login-form input {
  width: 100%;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
}
</style>
  </head>

  <body>
    <div class="page">
    <header>
      <div id="title">
        <img src="images/barco1.png" alt="ícone de barco" />
        <div class="headtitle">
          <h1>Luxo</h1>
          <h2>Aluguel de iates</h2>

        </div>
      </div>

      <nav>
        <ul class="navmenu">
          <li><a href="index.html">Página inicial</a></li>
          <li><a href="aluguel.html">Aluguel de iates</a></li>
          <li><a href="destinos.html">Destinos</a></li>
          <li><a href="tripulacao.html">Tripulação</a></li>
          <li><a href="contato.html" class="accent">Contato</a></li>
          <li><a href="admin.html">Admin</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="pagtitle">
        <div class="bgtitle"></div>
        <h2>ADMIN</h2>
      </div>

    <div class="login-form">
    <form id="loginForm">
    <div class="entry">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" required>
    </div>
    
    <div class="entry">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" required>
    </div>
    
    <div class="buttons">
      <button type="button" id="btnEntrar" class="button">Entrar</button>
    </div>
    </form>
  
  <div id="mensagemErro" style="display:none; color:red; margin-top:10px;">
    E-mail e Senha inválidos
  </div>
    </div>
    </main>
    </div>

    <footer>
      <p>© 2023 por Luxo aluguel de iates</p>
    </footer>
    <script src="js/jquery-3.6.4.min.js"></script>
    <script src="js/api.js"></script> 
    <script>
// Espera a página carregar
$(document).ready(function() {
    
  // Quando clicar no botão "Entrar"
  $('#btnEntrar').click(function() {
    
    // 1. PEGAR VALORES DOS CAMPOS
    var email = $('#loginEmail').val();
    var senha = $('#loginSenha').val();
    
    console.log("Email digitado:", email);
    console.log("Senha digitada:", senha);
    
    // 2. CRIAR OBJETO NO FORMATO EXIGIDO
    var objLoginSenha = {
      email: email,  // valor do campo email
      senha: senha   // valor do campo senha
    };
    
    console.log("Objeto criado:", objLoginSenha);
    
    // 3. CHAMAR FUNÇÃO DE VALIDAÇÃO
    var resultado = validarUsuario(objLoginSenha);
    
    console.log("Resultado da validação:", resultado);
    
    // 4. VERIFICAR RESULTADO
    if (resultado === true) {
      // Login CORRETO - redireciona
      window.location.href = "mensagens.html";
    } else {
      // Login ERRADO - mostra erro
      $('#mensagemErro').show();
      
      // Opcional: esconder depois de 3 segundos
      setTimeout(function() {
        $('#mensagemErro').fadeOut();
      }, 3000);
    }
  });
  
  // Opcional: Permitir Enter para enviar
  $('#loginEmail, #loginSenha').keypress(function(e) {
    if (e.which === 13) { // Tecla Enter
      $('#btnEntrar').click();
    }
  });
});
</script>
  </body>
</html>
